[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scala"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "nnunetv2==2.8.0",
    "dynamic_network_architectures==0.4.4",
    "SimpleITK>=2.3",
    "scipy",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["scala*"]
